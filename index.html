<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Validación de Socio - Automóvil Club San Luis</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: #f1f5f9;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    .val-card {
      width: 100%;
      max-width: 380px;
      background: #fff;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
      border: 1px solid #e2e8f0;
    }
    .val-header {
      background: #1a365d;
      color: #fff;
      padding: 18px;
      text-align: center;
    }
    .badge-ok {
      background: #16a34a;
      color: #fff;
      font-size: 1rem;
      padding: 8px 14px;
      border-radius: 8px;
      display: inline-block;
      font-weight: 700;
    }
    .badge-no {
      background: #dc2626;
      color: #fff;
      font-size: 1rem;
      padding: 8px 14px;
      border-radius: 8px;
      display: inline-block;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="val-card">
    <div class="val-header">
      <div class="fw-bold fs-6">AUTOMÓVIL CLUB SAN LUIS</div>
      <div class="small opacity-75">Consulta de Credencial y Beneficios</div>
    </div>
    <div class="p-4 text-center" id="contenidoValidacion">
      <div class="spinner-border text-primary mb-2" role="status"></div>
      <div class="text-muted small">Consultando estado del socio...</div>
    </div>
  </div>

  <script>
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzXpxyFh7VnheCVT70wogtKgFtXGkZmyAptCBhG0KpxKkUeqr-NlYFbYzCeIP5qvX5Vng/exec";

    (async function iniciarValidacion() {
      const contenedor = document.getElementById("contenidoValidacion");
      const params = new URLSearchParams(window.location.search);
      const socio = params.get("socio");

      if (!socio) {
        contenedor.innerHTML = `<div class="alert alert-warning mb-0">No se indicó un número de socio en el código QR.</div>`;
        return;
      }

      try {
        const urlConsulta = `${APPS_SCRIPT_URL}?socio=${encodeURIComponent(socio)}&t=${Date.now()}`;
        const resp = await fetch(urlConsulta, { method: "GET" });
        const data = await resp.json();

        if (!data || !data.ok) {
          contenedor.innerHTML = `
            <div class="badge-no mb-3">NO VÁLIDO</div>
            <p class="text-muted mb-0">${(data && data.error) ? data.error : "No se pudo validar el socio."}</p>
          `;
          return;
        }

        const badgeClase = data.descuentos_autorizados ? "badge-ok" : "badge-no";

        contenedor.innerHTML = `
          <div class="${badgeClase} mb-3">DESCUENTOS: ${data.estado_descuentos}</div>
          <h5 class="fw-bold mb-1">${data.nombre_apellido}</h5>
          <div class="text-muted small mb-3">N° de Socio: <strong>${data.n_socio}</strong></div>
          <div class="border rounded p-3 text-start bg-light small">
            <div class="mb-1"><strong>DNI:</strong> ${data.dni}</div>
            <div><strong>Categoría:</strong> ${data.categoria}</div>
          </div>
        `;
      } catch (err) {
        contenedor.innerHTML = `
          <div class="alert alert-danger mb-0 small">
            No se pudo conectar para validar. Verifique la conexión a internet.
          </div>
        `;
      }
    })();
  </script>
</body>
</html>
